{% extends 'base.html' %}
{% block content %}
<h2><i class="bi bi-book me-2"></i>Todas as Matérias</h2>
<p class="text-muted">Lista de todas as matérias de todos os seus estudos.</p>

<div class="row g-4">
  {% for subject in subjects %}
    <div class="col-md-3">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">{{ subject.name }}</h5>
          <p class="card-text text-muted small">
            <i class="bi bi-briefcase me-1"></i> {{ subject.contest.name }}
          </p>
          <div class="d-flex gap-2">
            <a href="{% url 'subjects:topics_by_subject' subject.id %}" class="btn btn-sm btn-outline-primary">
              <i class="bi bi-list-ul me-1"></i> Assuntos
            </a>
            <a href="{% url 'subjects:update' subject.id %}" class="btn btn-sm btn-outline-secondary">
              <i class="bi bi-pencil"></i>
            </a>
            <a href="{% url 'subjects:delete' subject.id %}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Tem certeza que deseja excluir esta matéria?');">
              <i class="bi bi-trash"></i>
            </a>
          </div>
        </div>
      </div>
    </div>
  {% empty %}
    <div class="col-12">
      <div class="alert alert-info">Nenhuma matéria cadastrada.</div>
    </div>
  {% endfor %}
</div>
{% endblock %}
