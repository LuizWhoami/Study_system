{% extends 'base.html' %}
{% load static %}
{% block title %}Estudar{% endblock %}

{% block extra_css %}
<style>
  .study-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 70vh;
  }
  .timer-display {
    font-size: 5rem;
    font-weight: 700;
    color: #7c8cff;
    letter-spacing: 0.05em;
    font-family: 'Inter', monospace;
    background: rgba(255,255,255,0.05);
    padding: 20px 40px;
    border-radius: 20px;
    border: 1px solid rgba(124, 140, 255, 0.2);
  }
  .study-buttons .btn {
    min-width: 120px;
    margin: 0 8px;
    border-radius: 50px;
    padding: 14px 35px;
    font-weight: 600;
    font-size: 1.1rem;
    transition: all 0.3s;
  }
  .study-buttons .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  }
  .study-info {
    margin-top: 30px;
    font-size: 1.1rem;
    color: #c0c8e0;
  }
  .study-info .badge {
    font-size: 1rem;
    padding: 8px 16px;
  }
  .current-study {
    background: rgba(124, 140, 255, 0.1);
    border: 1px solid rgba(124, 140, 255, 0.2);
    padding: 12px 24px;
    border-radius: 12px;
    margin-bottom: 20px;
  }
  .current-study strong {
    color: #7c8cff;
  }
  .custom-modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9999;
  }
  .custom-modal-overlay.active {
    display: flex;
  }
  .custom-modal {
    background: #1a1a2e;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    color: #e8e8f0;
    max-width: 500px;
    width: 95%;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7);
    animation: modalFade 0.3s ease;
  }
  @keyframes modalFade {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }
  .custom-modal h5 {
    color: #7c8cff;
    margin-bottom: 20px;
    font-weight: 600;
  }
  .custom-modal .form-label {
    font-weight: 500;
  }
  .custom-modal .form-select {
    background-color: #2d2d44;
    border-color: #3d3d5c;
    color: #fff;
    border-radius: 8px;
    padding: 10px 14px;
    width: 100%;
    margin-bottom: 15px;
  }
  .custom-modal .form-select:disabled {
    opacity: 0.5;
  }
  .custom-modal .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
  }
  .custom-modal .btn-secondary {
    background: #2d2d44;
    border: none;
    color: #e8e8f0;
    padding: 10px 24px;
    border-radius: 50px;
    font-weight: 500;
  }
  .custom-modal .btn-secondary:hover {
    background: #3d3d5c;
  }
  .custom-modal .btn-primary {
    background: #4f46e5;
    border: none;
    color: #fff;
    padding: 10px 24px;
    border-radius: 50px;
    font-weight: 500;
  }
  .custom-modal .btn-primary:hover {
    background: #4338ca;
  }
  .custom-modal .btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
</style>
{% endblock %}

{% block content %}
<div class="study-container">
  <div class="current-study text-center" id="current-study-info">
    <span class="text-muted">Nenhum estudo em andamento</span>
  </div>
  <div class="timer-display" id="timer-display">00:00:00</div>
  <div class="study-buttons mt-4">
    <button type="button" class="btn btn-success" id="start-btn">
      <i class="bi bi-play-fill me-1"></i> Iniciar
    </button>
    <button type="button" class="btn btn-warning" id="pause-btn" disabled>
      <i class="bi bi-pause-fill me-1"></i> Pausar
    </button>
    <button type="button" class="btn btn-danger" id="end-btn" disabled>
      <i class="bi bi-stop-fill me-1"></i> Finalizar
    </button>
  </div>
  <div class="study-info mt-4">
    <span id="session-timer" class="badge bg-secondary">Sessão: 0 min</span>
    <span id="assunto-name" class="badge bg-primary ms-2">Assunto: --</span>
  </div>
</div>

<div class="custom-modal-overlay" id="customModal">
  <div class="custom-modal">
    <h5><i class="bi bi-book me-2"></i>O que você vai estudar?</h5>
    <form id="study-select-form">
      <div class="mb-3">
        <label for="estudo-select" class="form-label">Estudo</label>
        <select class="form-select" id="estudo-select" required>
          <option value="">Selecione...</option>
          {% for estudo in estudos %}
            <option value="{{ estudo.id }}">{{ estudo.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label for="materia-select" class="form-label">Matéria</label>
        <select class="form-select" id="materia-select" disabled required>
          <option value="">Primeiro selecione um estudo</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="assunto-select" class="form-label">Assunto</label>
        <select class="form-select" id="assunto-select" disabled required>
          <option value="">Primeiro selecione uma matéria</option>
        </select>
      </div>
    </form>
    <div class="modal-actions">
      <button type="button" class="btn-secondary" id="cancel-modal-btn">Cancelar</button>
      <button type="button" class="btn-primary" id="confirm-study-btn" disabled>
        <i class="bi bi-play-circle me-1"></i> Começar
      </button>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // ===== ELEMENTOS =====
    const display = document.getElementById('timer-display');
    const startBtn = document.getElementById('start-btn');
    const pauseBtn = document.getElementById('pause-btn');
    const endBtn = document.getElementById('end-btn');
    const sessionTimer = document.getElementById('session-timer');
    const assuntoNameEl = document.getElementById('assunto-name');
    const currentInfo = document.getElementById('current-study-info');

    const modal = document.getElementById('customModal');
    const estudoSelect = document.getElementById('estudo-select');
    const materiaSelect = document.getElementById('materia-select');
    const assuntoSelect = document.getElementById('assunto-select');
    const confirmBtn = document.getElementById('confirm-study-btn');
    const cancelBtn = document.getElementById('cancel-modal-btn');

    // ===== ESTADO (localStorage) =====
    let timerInterval = null;
    let totalSeconds = parseFloat(localStorage.getItem('study_total_seconds') || '0');
    let isRunning = localStorage.getItem('study_is_running') === 'true';
    let sessionId = localStorage.getItem('study_session_id') || null;
    let selectedAssuntoName = localStorage.getItem('study_topic_name') || '';

    // ===== FUNÇÕES =====
    function formatTime(s) {
      const h = String(Math.floor(s / 3600)).padStart(2, '0');
      const m = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
      const sec = String(Math.floor(s % 60)).padStart(2, '0');
      return `${h}:${m}:${sec}`;
    }

    function updateDisplay() {
      display.textContent = formatTime(totalSeconds);
      sessionTimer.textContent = `Sessão: ${Math.floor(totalSeconds / 60)} min`;
    }

    function saveState() {
      localStorage.setItem('study_total_seconds', totalSeconds);
      localStorage.setItem('study_is_running', isRunning);
      if (sessionId) localStorage.setItem('study_session_id', sessionId);
      if (selectedAssuntoName) localStorage.setItem('study_topic_name', selectedAssuntoName);
    }

    function clearState() {
      localStorage.removeItem('study_total_seconds');
      localStorage.removeItem('study_is_running');
      localStorage.removeItem('study_session_id');
      localStorage.removeItem('study_topic_name');
      totalSeconds = 0;
      sessionId = null;
      selectedAssuntoName = '';
      isRunning = false;
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      clearState();
      updateDisplay();
      startBtn.disabled = false;
      pauseBtn.disabled = true;
      endBtn.disabled = true;
      pauseBtn.innerHTML = '<i class="bi bi-pause-fill me-1"></i> Pausar';
      currentInfo.innerHTML = `<span class="text-muted">Nenhum estudo em andamento</span>`;
      assuntoNameEl.textContent = 'Assunto: --';
    }

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      isRunning = true;
      saveState();
      timerInterval = setInterval(() => {
        totalSeconds++;
        updateDisplay();
        saveState();
      }, 1000);
      updateDisplay();
      startBtn.disabled = true;
      pauseBtn.disabled = false;
      endBtn.disabled = false;
      pauseBtn.innerHTML = '<i class="bi bi-pause-fill me-1"></i> Pausar';
    }

    function pauseTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
        isRunning = false;
        saveState();
        updateDisplay();
        pauseBtn.innerHTML = '<i class="bi bi-play-fill me-1"></i> Continuar';
      } else {
        // Continuar
        isRunning = true;
        saveState();
        timerInterval = setInterval(() => {
          totalSeconds++;
          updateDisplay();
          saveState();
        }, 1000);
        pauseBtn.innerHTML = '<i class="bi bi-pause-fill me-1"></i> Pausar';
        updateDisplay();
      }
    }

    function restoreState() {
      if (sessionId && selectedAssuntoName) {
        currentInfo.innerHTML = `<strong>Estudando:</strong> ${selectedAssuntoName}`;
        assuntoNameEl.textContent = `Assunto: ${selectedAssuntoName}`;
        startBtn.disabled = true;
        pauseBtn.disabled = false;
        endBtn.disabled = false;
        updateDisplay();

        if (isRunning) {
          timerInterval = setInterval(() => {
            totalSeconds++;
            updateDisplay();
            saveState();
          }, 1000);
          pauseBtn.innerHTML = '<i class="bi bi-pause-fill me-1"></i> Pausar';
        } else {
          pauseBtn.innerHTML = '<i class="bi bi-play-fill me-1"></i> Continuar';
        }
      } else {
        resetTimer();
      }
    }

    // ===== MODAL =====
    function openModal() {
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
      estudoSelect.value = '';
      materiaSelect.disabled = true;
      materiaSelect.innerHTML = '<option value="">Primeiro selecione um estudo</option>';
      assuntoSelect.disabled = true;
      assuntoSelect.innerHTML = '<option value="">Primeiro selecione uma matéria</option>';
      confirmBtn.disabled = true;
    }

    function closeModal() {
      modal.classList.remove('active');
      document.body.style.overflow = '';
    }

    // ===== EVENTOS =====
    startBtn.addEventListener('click', openModal);
    cancelBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', function(e) {
      if (e.target === modal) closeModal();
    });

    estudoSelect.addEventListener('change', function() {
      const estudoId = this.value;
      if (!estudoId) {
        materiaSelect.disabled = true;
        materiaSelect.innerHTML = '<option value="">Primeiro selecione um estudo</option>';
        assuntoSelect.disabled = true;
        assuntoSelect.innerHTML = '<option value="">Primeiro selecione uma matéria</option>';
        confirmBtn.disabled = true;
        return;
      }
      fetch(`/estudo/api/materias-por-estudo/${estudoId}/`)
        .then(r => r.json())
        .then(data => {
          materiaSelect.disabled = false;
          materiaSelect.innerHTML = '<option value="">Selecione...</option>';
          data.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m.id;
            opt.textContent = m.name;
            materiaSelect.appendChild(opt);
          });
          assuntoSelect.disabled = true;
          assuntoSelect.innerHTML = '<option value="">Primeiro selecione uma matéria</option>';
          confirmBtn.disabled = true;
        })
        .catch(err => console.error('Erro ao carregar matérias:', err));
    });

    materiaSelect.addEventListener('change', function() {
      const materiaId = this.value;
      if (!materiaId) {
        assuntoSelect.disabled = true;
        assuntoSelect.innerHTML = '<option value="">Primeiro selecione uma matéria</option>';
        confirmBtn.disabled = true;
        return;
      }
      fetch(`/estudo/api/assuntos-por-materia/${materiaId}/`)
        .then(r => r.json())
        .then(data => {
          assuntoSelect.disabled = false;
          assuntoSelect.innerHTML = '<option value="">Selecione...</option>';
          data.forEach(a => {
            const opt = document.createElement('option');
            opt.value = a.id;
            opt.textContent = a.name;
            assuntoSelect.appendChild(opt);
          });
          confirmBtn.disabled = true;
        })
        .catch(err => console.error('Erro ao carregar assuntos:', err));
    });

    assuntoSelect.addEventListener('change', function() {
      confirmBtn.disabled = !this.value;
      if (this.value) {
        selectedAssuntoName = this.options[this.selectedIndex].text;
      }
    });

    confirmBtn.addEventListener('click', function() {
      const assuntoId = assuntoSelect.value;
      if (!assuntoId) return;
      closeModal();

      fetch("{% url 'study:start_session' %}", {
        method: 'POST',
        headers: { 'X-CSRFToken': '{{ csrf_token }}' },
        body: new URLSearchParams({ topic: assuntoId })
      })
      .then(r => r.json())
      .then(data => {
        sessionId = data.session_id;
        localStorage.setItem('study_session_id', sessionId);
        localStorage.setItem('study_topic_name', selectedAssuntoName);

        currentInfo.innerHTML = `<strong>Estudando:</strong> ${selectedAssuntoName}`;
        assuntoNameEl.textContent = `Assunto: ${selectedAssuntoName}`;

        totalSeconds = 0;
        isRunning = true;
        saveState();
        startTimer();
      })
      .catch(err => {
        console.error('Erro ao iniciar sessão:', err);
        alert('Erro ao iniciar sessão. Tente novamente.');
        startBtn.disabled = false;
      });
    });

    // ===== PAUSAR / CONTINUAR =====
    pauseBtn.addEventListener('click', pauseTimer);

    // ===== FINALIZAR =====
    endBtn.addEventListener('click', function() {
      if (timerInterval) clearInterval(timerInterval);
      if (!sessionId) { resetTimer(); return; }

      const durationMinutes = Math.floor(totalSeconds / 60);
      if (durationMinutes < 1) {
        if (!confirm('Você estudou menos de 1 minuto. Deseja registrar mesmo assim?')) {
          if (isRunning) startTimer();
          return;
        }
      }

      fetch("{% url 'study:end_session' %}", {
        method: 'POST',
        headers: {
          'X-CSRFToken': '{{ csrf_token }}',
          'Content-Type': 'application/x-www-form-urlencoded',
        },
        body: new URLSearchParams({
          session_id: sessionId,
          duration_minutes: durationMinutes
        })
      })
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          alert(`✅ Sessão finalizada! ${durationMinutes} minutos registrados.`);
          resetTimer();
          clearState();
          currentInfo.innerHTML = `<span class="text-muted">Nenhum estudo em andamento</span>`;
          assuntoNameEl.textContent = 'Assunto: --';
        } else {
          throw new Error(data.error || 'Erro desconhecido');
        }
      })
      .catch(err => {
        console.error('Erro ao finalizar sessão:', err);
        alert('❌ Erro ao finalizar sessão. Tente novamente.');
        if (isRunning) startTimer();
      });
    });

    // ===== INICIALIZAÇÃO =====
    restoreState();
  });
</script>
{% endblock %}
