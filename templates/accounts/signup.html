{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-header">Cadastro</div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="btn btn-primary">Cadastrar</button>
          <a href="{% url 'accounts:login' %}" class="btn btn-link">Já tenho conta</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
