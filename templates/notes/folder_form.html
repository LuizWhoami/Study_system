{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6">
    <div class="card">
      <div class="card-header">
        <h4 class="mb-0">
          <i class="bi bi-folder{% if object %}-fill{% else %}-plus{% endif %} me-2"></i>
          {% if object %}Editar pasta{% else %}Nova pasta{% endif %}
        </h4>
      </div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label for="id_name" class="form-label">Nome</label>
            <input type="text" name="name" id="id_name" class="form-control"
                   value="{{ form.instance.name }}" required maxlength="80">
          </div>
          <div class="mb-3">
            <label for="id_color" class="form-label">Cor</label>
            <input type="color" name="color" id="id_color" class="form-control form-control-color"
                   value="{{ form.instance.color|default:'#6C63FF' }}">
          </div>
          <div class="mb-3">
            <label for="id_description" class="form-label">Descrição <span class="text-muted">(opcional)</span></label>
            <input type="text" name="description" id="id_description" class="form-control"
                   value="{{ form.instance.description }}" maxlength="255">
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success"><i class="bi bi-save me-1"></i> Salvar</button>
            <a href="{% url 'notes:folder_list' %}" class="btn btn-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
