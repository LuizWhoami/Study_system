{% extends 'base.html' %}
{% block title %}Excluir Questão{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-header">
        <h4><i class="bi bi-exclamation-triangle me-2"></i>Confirmar exclusão</h4>
      </div>
      <div class="card-body">
        <p>Tem certeza que deseja excluir a questão:</p>
        <blockquote class="blockquote p-3 bg-dark bg-opacity-25 rounded">
          <p class="mb-0">{{ object.enunciado }}</p>
        </blockquote>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Sim, excluir</button>
          <a href="{% url 'questions:list' %}" class="btn btn-secondary">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
