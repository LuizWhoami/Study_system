{% extends 'base.html' %}
{% block title %}{% if object %}Editar Questão{% else %}Nova Questão{% endif %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card">
      <div class="card-header">
        <h4><i class="bi bi-question-circle me-2"></i>{% if object %}Editar Questão{% else %}Nova Questão{% endif %}</h4>
      </div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label for="id_topic" class="form-label">Assunto</label>
            <select name="topic" id="id_topic" class="form-select" required>
              <option value="">Selecione...</option>
              {% for topic in form.fields.topic.queryset %}
                <option value="{{ topic.id }}" {% if form.instance.topic_id == topic.id %}selected{% endif %}>
                  {{ topic.subject.contest.name }} → {{ topic.subject.name }} → {{ topic.name }}
                </option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label for="id_enunciado" class="form-label">Enunciado</label>
            <textarea name="enunciado" id="id_enunciado" class="form-control" rows="3" required>{{ form.instance.enunciado }}</textarea>
          </div>
          <div class="row">
            <div class="col-md-6">
              <div class="mb-3">
                <label for="id_alternativa_a" class="form-label">Alternativa A</label>
                <input type="text" name="alternativa_a" id="id_alternativa_a" class="form-control" value="{{ form.instance.alternativa_a }}" required>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="id_alternativa_b" class="form-label">Alternativa B</label>
                <input type="text" name="alternativa_b" id="id_alternativa_b" class="form-control" value="{{ form.instance.alternativa_b }}" required>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="id_alternativa_c" class="form-label">Alternativa C</label>
                <input type="text" name="alternativa_c" id="id_alternativa_c" class="form-control" value="{{ form.instance.alternativa_c }}" required>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="id_alternativa_d" class="form-label">Alternativa D</label>
                <input type="text" name="alternativa_d" id="id_alternativa_d" class="form-control" value="{{ form.instance.alternativa_d }}" required>
              </div>
            </div>
          </div>
          <div class="mb-3">
            <label for="id_alternativa_correta" class="form-label">Alternativa Correta</label>
            <select name="alternativa_correta" id="id_alternativa_correta" class="form-select" required>
              <option value="">Selecione...</option>
              <option value="a" {% if form.instance.alternativa_correta == 'a' %}selected{% endif %}>A</option>
              <option value="b" {% if form.instance.alternativa_correta == 'b' %}selected{% endif %}>B</option>
              <option value="c" {% if form.instance.alternativa_correta == 'c' %}selected{% endif %}>C</option>
              <option value="d" {% if form.instance.alternativa_correta == 'd' %}selected{% endif %}>D</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="id_explicacao" class="form-label">Explicação (opcional)</label>
            <textarea name="explicacao" id="id_explicacao" class="form-control" rows="3">{{ form.instance.explicacao }}</textarea>
          </div>
          <div class="mb-3">
            <label for="id_dificuldade" class="form-label">Dificuldade</label>
            <select name="dificuldade" id="id_dificuldade" class="form-select">
              <option value="1" {% if form.instance.dificuldade == 1 %}selected{% endif %}>1 - Muito fácil</option>
              <option value="2" {% if form.instance.dificuldade == 2 %}selected{% endif %}>2 - Fácil</option>
              <option value="3" {% if form.instance.dificuldade == 3 %}selected{% endif %}>3 - Médio</option>
              <option value="4" {% if form.instance.dificuldade == 4 %}selected{% endif %}>4 - Difícil</option>
              <option value="5" {% if form.instance.dificuldade == 5 %}selected{% endif %}>5 - Muito difícil</option>
            </select>
          </div>
          <button type="submit" class="btn btn-success w-100">
            <i class="bi bi-save me-1"></i> Salvar
          </button>
        </form>
      </div>
    </div>
    <a href="{% url 'questions:list' %}" class="btn btn-secondary mt-3">
      <i class="bi bi-arrow-left me-1"></i> Voltar para lista
    </a>
  </div>
</div>
{% endblock %}
